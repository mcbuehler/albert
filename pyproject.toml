[project]
name = "rel8-albert-flask"
version = "0.1.0"
description = "Flask backend for the Albert voice assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.1,<4.0",
  "gunicorn~=23.0.0",
  "requests==2.32.5",
  "urllib3==2.6.3",
  # Pinned: the code relies on hindsight-vapi internals (memory._client) and imports hindsight_client directly.
  "hindsight-vapi==0.1.1",
  "hindsight-client==1.0.0",
  "psycopg[binary]>=3.2,<4",
  "tzdata",  # zoneinfo data; the serverless runtime may not ship /usr/share/zoneinfo
  "pyjwt[crypto]>=2.8,<3",  # verify Supabase Auth JWTs (ES256/RS256 via JWKS)
  "phonenumbers>=9.0.41,<10",  # region and time zone of a caller number; update now and then (new area codes)
]

[dependency-groups]
dev = [
  "ruff>=0.17,<1",
]

[tool.ruff]
target-version = "py310"
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I", "B"]

[tool.setuptools.packages.find]
include = ["albert*"]
